<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phonon</title>
    <style>
      html, body, #root { margin: 0; padding: 0; height: 100%; width: 100%; }
      html { background: #05050c; }
      body { background: #05050c; color: #b0bdd6; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

      /* ── 启动层（静态绘制，首帧即可见，不依赖 React 挂载） ──
         毛玻璃质感：半透明深色 + 背后缓慢漂移的极光渐变被 backdrop-blur 磨砂。
         加载期间整体由半透明渐变为不透明（boot-glass-in），就绪后整层淡出、
         主界面同步淡入（html.app-booted）。 */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        /* 关键：覆盖层永远不吃输入（此前光斑层可点击事件是重大教训） */
        pointer-events: none;
        /* boot-glass-in：加载期间由半透明渐变到不透明；
           boot-auto-out：防呆——JS 异常导致永不交接时，4 秒后自行淡出 */
        animation:
          boot-glass-in 1.1s ease-out both,
          boot-auto-out 0.5s ease 4s forwards;
      }
      #boot-splash.boot-out {
        opacity: 0;
        transition: opacity 0.5s ease;
      }
      @keyframes boot-auto-out {
        to { opacity: 0; }
      }
      #boot-aurora {
        position: absolute;
        inset: -20%;
        background:
          radial-gradient(60% 55% at 22% 18%, rgba(6, 182, 212, 0.30), transparent 70%),
          radial-gradient(55% 50% at 78% 82%, rgba(99, 102, 241, 0.34), transparent 72%),
          radial-gradient(45% 45% at 62% 26%, rgba(139, 92, 246, 0.20), transparent 75%),
          #05050c;
        animation: boot-drift 19s ease-in-out infinite alternate;
      }
      #boot-card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 34px 58px 30px;
        border-radius: 22px;
        background: rgba(10, 12, 24, 0.52);
        border: 1px solid rgba(150, 180, 255, 0.14);
        box-shadow:
          0 18px 60px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(26px) saturate(150%);
        -webkit-backdrop-filter: blur(26px) saturate(150%);
      }
      #boot-mark {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: radial-gradient(circle at 34% 32%, #eafcff 0%, #06b6d4 38%, #0e7490 72%, #082f49 100%);
        box-shadow: 0 0 26px rgba(6, 182, 212, 0.55), 0 0 64px rgba(6, 182, 212, 0.22);
        animation: boot-pulse 2.2s ease-in-out infinite;
      }
      #boot-word {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 7px;
        text-indent: 7px; /* 抵消末字符字距，视觉居中 */
        color: rgba(210, 226, 255, 0.92);
      }
      #boot-bar {
        width: 132px;
        height: 2px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(150, 180, 255, 0.12);
      }
      #boot-bar::after {
        content: '';
        display: block;
        width: 44%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #06b6d4, #818cf8, transparent);
        animation: boot-sweep 1.25s ease-in-out infinite;
      }
      @keyframes boot-glass-in {
        from { opacity: 0.55; }
        to { opacity: 1; }
      }
      @keyframes boot-drift {
        from { transform: translate3d(-2.5%, -1.5%, 0) scale(1); }
        to { transform: translate3d(2.5%, 2%, 0) scale(1.06); }
      }
      @keyframes boot-pulse {
        0%, 100% { box-shadow: 0 0 22px rgba(6, 182, 212, 0.45), 0 0 56px rgba(6, 182, 212, 0.16); }
        50% { box-shadow: 0 0 32px rgba(6, 182, 212, 0.68), 0 0 84px rgba(6, 182, 212, 0.30); }
      }
      @keyframes boot-sweep {
        from { transform: translateX(-110%); }
        to { transform: translateX(330%); }
      }
      /* 主界面：就绪前隐藏，就绪后与启动层交叉淡入。
         boot-root-failsafe：防呆——3 秒后无条件显示（仅作用于未交接状态） */
      #root { opacity: 0; }
      html:not(.app-booted) #root {
        animation: boot-root-failsafe 0s linear 3s forwards;
      }
      @keyframes boot-root-failsafe {
        to { opacity: 1; }
      }
      html.app-booted #root {
        opacity: 1;
        transition: opacity 0.5s ease 0.08s;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-aurora, #boot-mark, #boot-bar::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div id="boot-aurora"></div>
      <div id="boot-card">
        <div id="boot-mark"></div>
        <div id="boot-word">PHONON</div>
        <div id="boot-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // 启动层时间原点：用于"最短展示时长"（加载过快时动画不一闪而过）
      window.__bootStart = performance.now()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
