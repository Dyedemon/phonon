<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phonon</title>
    <style>
      html, body, #root { margin: 0; padding: 0; height: 100%; width: 100%; }
      html { background: #05050c; }
      body { background: #05050c; color: #b0bdd6; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

      /* ── 启动层（静态绘制，首帧即可见，不依赖 React 挂载） ──
         真·桌面透视：Windows 下窗口为透明 + 系统亚克力（见
         tauri.windows.conf.json），启动期间 html/body 也保持透明，
         于是整窗就是一块磨砂玻璃——桌面壁纸透过它模糊呈现。
         #boot-veil 在加载过程中由半透明渐变为不透明（boot-veil-in），
         交接时整层快速淡出、主界面同步淡入。 */
      html:not(.app-booted),
      html:not(.app-booted) body {
        background: transparent !important;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        /* 关键：覆盖层永远不吃输入（此前光斑层吃掉点击是重大教训） */
        pointer-events: none;
      }
      #boot-veil {
        position: absolute;
        inset: 0;
        background: #05050c;
        animation: boot-veil-in 1.2s ease-out both;
      }
      /* 加载过程中由半透明渐变为更不透明；终点保留 0.85 而非 1.0，
         让磨砂的桌面始终隐约可见（参考 ZCode 的启动观感）。
         想要完全不透明把下面的 0.85 改成 1 即可。 */
      @keyframes boot-veil-in {
        from { opacity: 0.35; }
        to { opacity: 0.85; }
      }
      #boot-splash.boot-out {
        opacity: 0;
        transition: opacity 0.45s ease;
      }
      #boot-card {
        position: relative;
        padding: 30px 54px 26px;
        border-radius: 20px;
        background: rgba(10, 12, 24, 0.32);
        border: 1px solid rgba(150, 180, 255, 0.16);
        box-shadow:
          0 16px 54px rgba(0, 0, 0, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(18px) saturate(140%);
        -webkit-backdrop-filter: blur(18px) saturate(140%);
      }
      #boot-word {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 7px;
        text-indent: 7px; /* 抵消末字符字距，视觉居中 */
        color: rgba(210, 226, 255, 0.92);
      }
      /* 主界面：就绪前隐藏，就绪后与启动层交叉淡入 */
      #root { opacity: 0; }
      html.app-booted #root {
        opacity: 1;
        transition: opacity 0.45s ease 0.05s;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-veil { animation: none; opacity: 0.85; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div id="boot-veil"></div>
      <div id="boot-card">
        <div id="boot-word">PHONON</div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // 启动层时间原点：用于"最短展示时长"（加载过快时动画不一闪而过）
      window.__bootStart = performance.now()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
