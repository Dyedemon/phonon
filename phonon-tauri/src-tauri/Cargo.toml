[package]
name = "app"
version = "0.1.0"
description = "Phonon - High-fidelity audio application platform"
authors = ["Phonon Contributors"]
license = "MIT"
repository = "https://github.com/phonon/phonon"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-shell = "2.3"
tauri-plugin-log = "2.8"
tauri-plugin-dialog = "2.7"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

phonon-core = { path = "../../phonon-core" }
phonon-source = { path = "../../phonon-source" }
phonon-plugin = { path = "../../phonon-plugin" }
phonon-codec = { path = "../../phonon-codec" }
phonon-media = { path = "../../phonon-media" }
# NOTE: calibration-types / calibration-engine are deliberately NOT dependencies
# here. The acoustic calibration plugin is an external wasm module — fitting
# maths (rustfft) must stay out of the main binary. Uninstalling the plugin
# leaves the app fully functional.

# Force getrandom to use std backend (avoids dlltool.exe dependency)
getrandom = { version = "0.4", features = ["std"] }

# Filesystem watcher for auto-syncing watched folders
notify = "6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.54", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Media_Multimedia",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
