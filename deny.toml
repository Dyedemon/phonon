# cargo-deny configuration (v2 format)
# https://embarkstudios.github.io/cargo-deny/
# §14 Compliance Gate: block GPL/LGPL/AGPL/SSPL/BUSL/CPAL/commercial/UNKNOWN licenses
#
# v2 model (version = 2):
#   - All licenses NOT in `allow` are automatically DENIED (default-deny)
#   - The `deny` list is removed — it served no purpose under this model
#   - `unlicensed` defaults to deny
#   - `copyleft` defaults to deny

[licenses]
version = 2
# Allow these permissive licenses. Everything else is denied by default.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "NCSA",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = []
skip = []

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # quick-xml <0.41 (quadratic attribute scan / unbounded ns alloc) — comes
    # via `plist` → lofty (MP4/iTunes metadata). No plist release pulls the
    # fixed quick-xml yet; only parses the user's own music files (DoS-class).
    { id = "RUSTSEC-2026-0194", reason = "quick-xml via plist 1.9; bump when plist ships quick-xml >=0.41" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml via plist 1.9; bump when plist ships quick-xml >=0.41" },
    # Unmaintained transitive crates — no safe upgrade exists:
    { id = "RUSTSEC-2025-0100", reason = "unmaintained transitive crate" },
    { id = "RUSTSEC-2025-0098", reason = "unmaintained transitive crate" },
    { id = "RUSTSEC-2025-0081", reason = "unic family unmaintained (transitive)" },
    { id = "RUSTSEC-2025-0080", reason = "unic family unmaintained (transitive)" },
    { id = "RUSTSEC-2025-0075", reason = "unmaintained transitive crate" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; via image→ravif→rav1e" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained; transitive" },
    # zip 0.6 via phonon-installer — 解包的是我们自己的 app.zip（非对抗输入）；
    # zip 9.x API 全重写，自研安装器迁移另排期
    { id = "RUSTSEC-2026-0367", reason = "zip 0.6 via phonon-installer (own archive only)" },
    { id = "RUSTSEC-2026-0368", reason = "zip 0.6 via phonon-installer (own archive only)" },
    { id = "RUSTSEC-2026-0369", reason = "zip 0.6 via phonon-installer (own archive only)" },
    # zstd 家族四连（zstd-rs 集中发布）— 经 wasmtime 48 编译缓存
    # （0391/0398/0410）与 zip 0.6 → phonon-installer（0403）引入。
    # 漏洞前提均为对抗性输入或跨信任域复用（多用户 context 共享、损坏
    # legacy frame、wasm 沙箱内分配器损坏——公告明示不越沙箱），
    # Phonon 是单用户本地进程：缓存/归档数据单一来源且非对抗输入，
    # wasm 内容是用户自己的插件。zstd 0.13 / zstd-safe 5+7 / zstd-sys
    # 2.0 都锁死在 zip 0.6 / wasmtime 48 的版本约束上，随二者大版本升级解除。
    { id = "RUSTSEC-2026-0391", reason = "zstd 0.13 via wasmtime 48 cache; local single-user; bump with wasmtime 49" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7 via wasmtime 48 seekable cache; local single-user; bump with wasmtime 49" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe 5 via zip 0.6 → phonon-installer (own archive); bump with zip migration" },
    { id = "RUSTSEC-2026-0410", reason = "zstd-sys 2.0 via wasmtime 48; corruption contained in wasm sandbox; bump with wasmtime 49" },
    # zvariant/zbus 系 unmaintained — tauri-plugin-single-instance 依赖，无升级路径
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; via tauri-plugin-single-instance" },
    { id = "RUSTSEC-2026-0371", reason = "zvariant unmaintained; via tauri-plugin-single-instance" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; via tauri-plugin-single-instance" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
